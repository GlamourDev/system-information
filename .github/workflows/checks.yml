name: Checks
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:smartmontools
      - run: npm run build:windows-helper
      - run: npm run lint
      - run: npm test
      - run: npm run smoke:hardware
      - run: node scripts/check-windows-helper.mjs
      - run: node scripts/check-smartmontools.mjs
